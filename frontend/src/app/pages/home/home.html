<header>
  <h1>QuickDeal</h1>
  <button type="button" class="button-secondary" (click)="logout()">
    Выйти
  </button>
</header>

<div class="content">
  <div class="form-column">
    <app-create-ad-form />
  </div>

  <div class="list-column">
    <h2>Объявления</h2>

    @if (ads().length === 0) {
    <p class="hint">Объявлений пока нет</p>
    } @for (ad of ads(); track ad.id) {
    <div class="ad-card">
      <h3>{{ ad.title }}</h3>
      <p>{{ ad.description }}</p>
      <p>Цена: {{ ad.price }} ₽</p>
      <p>Автор: {{ ad.author }}</p>
      <p>{{ ad.created_at | date: 'dd.MM.yyyy HH:mm' }}</p>
    </div>
    }
  </div>
</div>
