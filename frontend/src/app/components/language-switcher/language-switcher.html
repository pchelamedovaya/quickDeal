<div
  class="switcher"
  role="group"
>
  @for (language of languages; track language) {
  <button
    type="button"
    class="button-secondary"
    [class.active]="localization.language() === language"
    (click)="localization.setLanguage(language)"
  >
    {{ labelKey(language) | translate }}
  </button>
  }
</div>
